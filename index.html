<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studio Astra Architects</title>
  
  <!-- Font Awesome for clean vectors, social icons, and contact indicators -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
      scroll-behavior:smooth;
    }
    body{
      background:#f5f3ef;
      color:#222;
    }
    /* Fixed Navigation Bar with Logo */
    nav{
      position:fixed;
      top:0;
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 8%;
      background:rgba(0,0,0,0.7);
      z-index:1000;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .nav-brand img {
      height: 45px;
      width: auto;
      border-radius: 4px;
    }
    .nav-brand h2{
      color:white;
      letter-spacing:1px;
      font-size: 1.3rem;
    }
    nav ul{
      display:flex;
      gap:30px;
      list-style:none;
    }
    nav ul li a{
      text-decoration:none;
      color:white;
      font-size:14px;
      transition:0.3s;
    }
    nav ul li a:hover{
      color:#d9b98c;
    }
    /* Full-Screen Background Image Section */
    header{
      width:100%;
      height:100vh;
      background-image: url('hero.png');
      background-size:cover;
      background-position:center;
      background-repeat: no-repeat;
    }
    section{
      padding:90px 8%;
    }
    .section-title{
      font-size:2.5rem;
      margin-bottom:20px;
      color:#222;
    }
    .about p{
      max-width:900px;
      line-height:1.8;
      color:#555;
      font-size:1.05rem;
      margin-bottom: 40px;
    }
    
    /* Philosophy & Approach Grid */
    .about-details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }
    .about-card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      border-left: 4px solid #d9b98c;
    }
    .about-card h3 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      color: #222;
    }
    .about-card ul {
      list-style-type: square;
      padding-left: 20px;
      color: #555;
    }
    .about-card ul li {
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .services{
      background:#fff;
    }
    .service-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      margin-top:40px;
    }
    .service-card{
      background:#f5f3ef;
      padding:35px;
      border-radius:12px;
      transition:0.3s;
    }
    .service-card:hover{
      transform:translateY(-5px);
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }
    .service-card h3{
      margin-bottom:15px;
      color:#222;
    }

    /* Dynamic Gallery Layout Filters */
    .projects{
      background:#f9f9f9;
    }
    .gallery-filters {
      display: flex;
      gap: 15px;
      margin: 25px 0;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #ddd;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #d9b98c;
      color: #111;
      border-color: #d9b98c;
    }
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:24px;
      margin-top:20px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      height: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    /* Simple utility classes for dynamic script filtering */
    .gallery-item.hide {
      display: none;
    }
    .gallery-item.show {
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .gallery-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .project-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .project-overlay h3 {
      color: #fff;
      font-size: 1.3rem;
      transform: translateY(20px);
      transition: transform 0.4s ease;
      margin-bottom: 5px;
    }
    .project-overlay p {
      color: #d9b98c;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transform: translateY(20px);
      transition: transform 0.4s ease 0.1s;
    }
    .gallery-item:hover img {
      transform: scale(1.08);
    }
    .gallery-item:hover .project-overlay {
      opacity: 1;
    }
    .gallery-item:hover .project-overlay h3,
    .gallery-item:hover .project-overlay p {
      transform: translateY(0);
    }

    /* Founders Section with Vector Icons */
    .founders{
      background:white;
    }
    .founder-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      margin-top:40px;
    }
    .founder-card{
      background:#f5f3ef;
      padding:40px;
      border-radius:12px;
      display: flex;
      flex-direction: column;
    }
    .founder-card h3 {
      margin-bottom: 5px;
    }
    .founder-title {
      color: #d9b98c;
      font-weight: bold;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    .founder-card p:not(.founder-title) {
      color: #555;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .founder-socials {
      margin-top: auto;
      display: flex;
      gap: 20px;
    }
    .founder-socials a {
      text-decoration: none;
      color: #222;
      font-size: 1.5rem;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    .founder-socials a:hover {
      color: #d9b98c;
      transform: translateY(-3px);
    }

    /* Why Choose Us Section */
    .why-choose-us {
      background: #fdfcfb;
    }
    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }
    .benefit-card {
      text-align: left;
      padding: 20px 10px;
    }
    .benefit-icon {
      width: 50px;
      height: 50px;
      background: #f5f3ef;
      color: #d9b98c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .benefit-card h3 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #222;
    }
    .benefit-card p {
      color: #666;
      line-height: 1.6;
    }

    /* Contact Block Grid Form Styles */
    .contact{
      background:#1d1d1d;
      color:white;
    }
    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 50px;
      text-align: left;
      margin-top: 40px;
    }
    .contact-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .contact-info p {
      margin-bottom: 20px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
    }
    .contact-info p i {
      font-size: 1.3rem;
      width: 30px;
    }
    .contact-info a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }
    .contact-info a:hover {
      color: #d9b98c;
    }
    .contact-form {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d9b98c;
      margin-bottom: 8px;
    }
    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: #d9b98c;
    }
    .submit-btn {
      background: #d9b98c;
      color: #111;
      padding: 14px 30px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.3s;
      width: 100%;
    }
    .submit-btn:hover {
      background: #fff;
    }
    footer{
      background:#111;
      color:#999;
      text-align:center;
      padding:20px;
      font-size:14px;
    }
    @media(max-width:900px){
      nav{
        flex-direction:column;
        gap:15px;
        padding: 15px 20px;
      }
      nav ul {
        gap: 20px;
      }
      .founder-grid, .contact-container{
        grid-template-columns:1fr;
        gap: 40px;
      }
    }

      </div>
      <div class="about-card">
        <h3>Our Approach</h3>
        <ul>
          <li><strong>Client-Centric Vision:</strong> Translating your unique lifestyle into physical spaces.</li>
          <li><strong>End-to-End Delivery:</strong> Managing everything from initial blueprints to final handover.</li>

  <!-- SPLIT CONTACT GRID CONTAINER -->
  <section class="contact" id="contact">

  <!-- GALLERY ISOLATION FILTER SCRIPT ENGINE -->
  <script>
    const filterButtons = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');

    // Function to handle filtering logic
    function filterGallery(targetFilter) {
      // Toggle button highlights
      filterButtons.forEach(btn => {
        if(btn.getAttribute('data-filter') === targetFilter) {
btn.classList.add('active');} else {btn.classList.remove('active');}});// Filter grid image cardsgalleryItems.forEach(item => {const projectType = item.getAttribute('data-project');if (targetFilter === 'all' || projectType === targetFilter) {item.classList.remove('hide');item.classList.add('show');} else {item.classList.remove('show');item.classList.add('hide');}});}// Trigger filter when a filter button is clickedfilterButtons.forEach(button => {button.addEventListener('click', () => {filterGallery(button.getAttribute('data-filter'));});});// Trigger filter when an image card itself is clickedgalleryItems.forEach(item => {item.addEventListener('click', () => {const associatedProject = item.getAttribute('data-project');filterGallery(associatedProject);});});
  </style>
